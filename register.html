<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin đăng nhập</title>
    <link rel="icon" href="icon/leaf.png" />
    <link rel="stylesheet" href="css/register.css" />
  </head>

  <body>
    <div id="container">
      <div class="banner">
        <div class="left">
          <a href="index.html" style="text-decoration: none"
            ><h2 style="color: rgba(75, 238, 43, 1)">
              <img src="icon/leaf.png" alt="" /> GreenFood
            </h2>
          </a>
        </div>
        <div class="right">
          <a href="index.html">Cửa hàng</a>
          <a href="">Công thức</a>
          <a href="">Vị trí</a>
          <a href="" class="sign-up"> <span class="a-sign-up">Đăng ký</span></a>
        </div>
      </div>
      <div class="log-wrapper">
        <div class="log">
          <div class="log-head">
            <h1>Đăng ký</h1>
            <p>Vui lòng nhập thông tin đăng ký</p>
          </div>
          <form action="">
            <div class="log-body">
              <div class="log-body-username">
                <label for="">Tài khoản</label>
                <input type="text" placeholder="Gmail" />
              </div>
              <div class="log-body-password">
                <label for="">Mật khẩu</label>
                <input type="password" name="" id="" placeholder="Password" />
              </div>
              <div class="log-body-confirm-password">
                <label for="">Xác nhận mật khẩu</label>
                <input
                  type="password"
                  name=""
                  id=""
                  placeholder="Confirm password"
                />
              </div>
              <button class="btn-log">Đăng ký</button>
            </div>
          </form>
          <div class="line">Hoặc đăng ký bằng</div>
          <div class="btn-option">
            <button><img src="icon/google.png" alt="" />Google</button>
            <button><img src="icon/facebook.png" alt="" />Facebook</button>
          </div>
          <div class="sign-up">
            <p>Đã có tài khoản?</p>
            <a href="login.html">Đăng nhập</a>
          </div>
        </div>
      </div>
      <iframe
        id="footer-iframe"
        src="footer.html"
        width="100%"
        height="420"
        frameborder="0"
        scrolling="no"
        title="Footer"
      >
      </iframe>

      <script>
        const iframe = document.getElementById("footer-iframe");

        window.addEventListener("message", function (e) {
          if (e.data && typeof e.data.height === "number") {
            iframe.style.height = e.data.height + "px";
          }
        });
      </script>
    </div>
  </body>
</html>
