<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/quanlynguoidung1_style.css" />
    <title>Customer Details - GreenFood</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="logo">GreenFood</div>
      <h1>Customer Details</h1>
    </header>

    <div class="dropdown">
      <span>Bạn muốn mua hàng với hình thức nào?</span>
      <i class="fas fa-chevron-down"></i>
    </div>

    <div class="main-content">
      <div class="left">
        <div class="user-card">
          <div class="avatar">U</div>
          <div>
            <strong>Username</strong>
          </div>
          <i class="fas fa-chevron-right" style="margin-left: auto"></i>
        </div>

        <div class="quick-links">
          <div class="quick-card">
            <i class="fas fa-id-card"></i>
            <div style="font-size: 0.85rem">Thẻ member</div>
          </div>
          <div class="quick-card">
            <i class="fas fa-file-alt"></i>
            <div style="font-size: 0.85rem">Đơn hàng</div>
          </div>
          <div class="quick-card">
            <i class="fas fa-percent"></i>
            <div style="font-size: 0.85rem">Giảm giá</div>
          </div>
          <div class="quick-card">
            <i class="fas fa-gift"></i>
            <div style="font-size: 0.85rem">Khác</div>
          </div>
        </div>

        <div class="profile-box">
          <strong>Hoàn thiện hồ sơ của bạn</strong>
          <p style="margin: 10px 0 20px 0; font-size: 0.95rem; color: #555">
            Bổ sung các thông tin sẽ giúp bạn thanh toán nhanh và an toàn hơn
          </p>
          <button class="btn-continue">Tiếp tục</button>
        </div>
      </div>

      <div class="right">
        <div class="menu-list">
          <div class="menu-item">
            <span style="font-size: 1.4rem"
              ><img src="./icon/leaf.png" alt="" class="logo"
            /></span>
            <strong><a href="">GreenFood AI</a></strong>
            <i class="fas fa-chevron-right" style="margin-left: auto"></i>
          </div>
          <div class="menu-item">
            <i class="fas fa-map-marker-alt"></i>
            <a href="">Sổ địa chỉ</a>
            <i class="fas fa-chevron-right" style="margin-left: auto"></i>
          </div>
          <div class="menu-item">
            <i class="fas fa-file-contract"></i>
            <a href="./quanlynguoidung3.html">Điều khoản</a>
            <i class="fas fa-chevron-right" style="margin-left: auto"></i>
          </div>
          <div class="menu-item">
            <i class="fas fa-shield-alt"></i>
            <a href="./chinhsachbaomat.html">Chính sách bảo mật</a>
            <i class="fas fa-chevron-right" style="margin-left: auto"></i>
          </div>

          <div class="menu-item logout">
            <i class="fas fa-sign-out-alt"></i>
            <strong
              ><a href="./login.html" style="color: red">Đăng xuất</a></strong
            >
            <i class="fas fa-chevron-right" style="margin-left: auto"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
